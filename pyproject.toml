[project]
name = "directions"
version = "0.1.0"
description = "Answer the research question: How does a low-dimensional causal control signal propagate through and get transformed by successive layers of a neural network?"
readme = "README.md"
authors = [
    { name = "Eric Carlson", email = "ericccarlson0@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=4.51",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "hf-transfer>=0.1.8",
]

[project.scripts]
directions = "directions.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

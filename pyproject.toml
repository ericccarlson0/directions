[project]
name = "directions"
version = "0.1.0"
description = "Answer the research question: How does a low-dimensional causal control signal propagate through and get transformed by successive layers of a neural network?"
readme = "README.md"
authors = [
    { name = "Eric Carlson", email = "ericccarlson0@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.14.0",
    "matplotlib>=3.10",
    "numpy>=2.4.6",
    "pyyaml>=6.0",
    "safetensors>=0.8.0",
    "torch>=2.14.0",
    "transformers>=5.16.1",
    "typer>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
directions = "directions.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]

command: uv run python scripts/stages.py 'uv run python scripts/volume_cleanup.py --delete-model allenai/Olmo-3-1025-7B --delete-incomplete --yes' 'uv run directions varmap --config configs/varmap_qwen3_8b.yaml --run-id varmap_qwen3_8b_seed20260916' 'uv run directions varprobe --config configs/varprobe_qwen3_8b.yaml --run-id varprobe_qwen3_8b_seed20260916'
gpu_tier: ADA_24          # memory class ("tier")
gpu_type: ""              # exact device name to pin instead of the tier, e.g. "NVIDIA RTX A4500"
datacenter: EUR-NO-1      # data center of the `directions` network volume
flash_env: ci-b             # Flash environment; one run at a time per environment
timeout_minutes: 180

# Request a GPU run: change this file, commit, push. The run-gpu workflow triggers on every push that changes
# this file and runs `command` at the repository root on a RunPod worker. To re-request an identical command,
# there needs to be a new `request` label. A manual workflow_dispatch ignores this file.
request: comp_olmo3_7b_learned_landmarks_serial # note that a new label re-requests the same command
command: uv run python scripts/stages.py 'uv run directions pilot --config configs/comp_learned_olmo3_7b.yaml --run-id comp_learned_olmo3_7b_seed20260907' 'uv run python scripts/landmarks.py --config configs/trajectories_composition.yaml --fv-run /runpod-volume/results/run-35907267011/comp_olmo3_7b_seed20260907 --learned-run results/comp_learned_olmo3_7b_seed20260907 --run-id comp_landmarks_olmo3_7b_seed20260907' 'uv run directions serial --config configs/serial.yaml --fv-run /runpod-volume/results/run-35907267011/comp_olmo3_7b_seed20260907 --learned-run results/comp_learned_olmo3_7b_seed20260907 --run-id serial_olmo3_7b_seed20260907'
gpu_tier: ADA_24         # memory class ("tier")
gpu_type: ""              # exact device name to pin instead of the tier, e.g. "NVIDIA RTX A4500"
datacenter: EUR-NO-1       # data center of the `directions` network volume
flash_env: ci-b          # Flash environment; one run at a time per environment
timeout_minutes: 340
max_output_mb: 8

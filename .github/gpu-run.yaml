# Request a GPU run: change this file, commit, push. The run-gpu workflow triggers on every push that changes
# this file and runs `command` at the repository root on a RunPod worker. To re-request an identical command,
# there needs to be a new `request` label. A manual workflow_dispatch ignores this file.
request: d54_das_qwen3_8b_seed20260916 # note that a new label re-requests the same command
command: uv run python scripts/stages.py 'uv run directions das --config configs/das_d54_qwen3_8b_joint.yaml --run-id das_d54_qwen3_8b_joint_seed20260916' 'uv run directions das --config configs/das_d54_qwen3_8b_shared.yaml --run-id das_d54_qwen3_8b_shared_seed20260916'
gpu_tier: ADA_24          # memory class ("tier")
gpu_type: ""              # exact device name to pin instead of the tier, e.g. "NVIDIA RTX A4500"
datacenter: EUR-NO-1      # data center of the `directions` network volume
flash_env: ci-b              # Flash environment; one run at a time per environment
timeout_minutes: 330
max_output_mb: 32

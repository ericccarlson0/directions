# The conditional probe and the logit lens at the answer token (docs/DECISIONS.md D46) on the three-bracket task
# (D51). The files of this family differ only in model.name, and from the two-bracket files only in expressions
# and marks (enforced by tests/test_configs.py).
name: varprobe
seed: 20260916
output_dir: results

model:
  backend: hf
  name: Qwen/Qwen3-14B-Base
  dtype: bfloat16          # model execution; states captured as float32
  device: cuda             # fail fast rather than fall back to the CPU (docs/INFRA.md)
  batch_size: 128

expressions: [three_lane]     # (a+b) - (c+d) - (e+f) = Y (D51)
n_examples: 2048              # per task, outside the demonstration pool (one-lane has 574); the answered ones enter
n_shots: 8
n_demo_pool: 96
n_folds: 5                    # outer cross-validation folds
lambdas: [0.1, 1.0, 10.0, 100.0]   # ridge grid (the kernel's mean diagonal is 1), chosen by leave-one-out accuracy
n_perm: 200                   # permutations within the conditioning classes (probe), shuffles (lens)
alpha: 0.05                   # family-wise over the read points of one target, model and task
min_accuracy: 0.5
gate: true                    # only the expressions the model answers enter the probe and the lens
positive_control: true        # a given S1 at the a token itself, read point L/2
determinism_check: true
figures: true
marks: {}                     # the three-bracket gather: unknown before the map, which runs in the same job

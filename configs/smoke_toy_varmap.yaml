# Smoke run of the variable map (D45) on a random tiny model (CPU, no downloads): the model cannot do the task, so
# the gate is off; checks the plumbing, the files and the figures.
name: varmap
seed: 20260916
output_dir: results

model:
  backend: toy
  dtype: float32
  device: cpu
  batch_size: 64

expressions: [two_lane, one_lane]
n_bases: 4
n_shots: 2
n_demo_pool: 8
read_points: [0, 2, 4]
n_boot: 50
min_accuracy: 0.0
gate: false

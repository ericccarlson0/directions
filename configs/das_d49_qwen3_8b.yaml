# DAS at the answer token on Qwen3-8B Base (docs/DECISIONS.md D49), preregistered before any 8B data relative to the
# D45 gather (G = 24, run 38738001665): sites G, G+1, G+2 and the control; k = 8, 16, 32; 20 epochs. Otherwise D48.
name: das_d49
seed: 20260916
output_dir: results

model:
  backend: hf
  name: Qwen/Qwen3-8B-Base
  dtype: bfloat16
  device: cuda             # fail fast rather than fall back to the CPU (docs/INFRA.md)
  batch_size: 128          # the state captures; the fits run on batch_size below

sites: [21, 24, 25, 26]       # the control and G..G+2 (D49)
control_site: 21              # neither bracket swap moves the answer here (D45; at 22-23 S2 flips 0.30)
variables: [S1, S2, Y, a]
ks: [8, 16, 32]
null_k: 32                    # the shuffled-target null at the largest k
n_train: 1536                 # bases per split, disjoint expressions
n_val: 256
n_test: 512
n_shots: 8
n_demo_pool: 96
batch_size: 32
epochs: 20
lr: 0.05
lambdas: [0.1, 1.0, 10.0, 100.0]   # the projection-decodability check's ridge grid (D46's probe)
n_boot: 1000
alpha: 0.05
k_tolerance: 0.05             # k* = the smallest k within this of the best validation Cause
cause_lower: 0.5              # D48 reading: held when Cause lo >= 0.5 and Isolate lo >= 0.75 at k*
isolate_lower: 0.75
determinism_check: true
figures: true

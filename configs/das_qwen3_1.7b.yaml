# Distributed alignment search at the answer token, scored by Cause and Isolate (docs/DECISIONS.md D48), on the
# two-lane task. The files of this family differ only in model.name, sites and control_site (tests/test_configs.py).
name: das
seed: 20260916
output_dir: results

model:
  backend: hf
  name: Qwen/Qwen3-1.7B-Base
  dtype: bfloat16
  device: cuda             # fail fast rather than fall back to the CPU (docs/INFRA.md)
  batch_size: 128          # the state captures; the fits run on batch_size below

sites: [19, 21, 22, 23, 24, 28]   # read points of the answer token (D48)
control_site: 19            # the operands are not causally present here (D45)
variables: [S1, S2, Y, a]
ks: [1, 2, 4, 8, 16]
null_k: 16                    # the shuffled-target null
n_train: 1536                 # bases per split, disjoint expressions
n_val: 256
n_test: 512
n_shots: 8
n_demo_pool: 96
batch_size: 32
epochs: 6
lr: 0.05
lambdas: [0.1, 1.0, 10.0, 100.0]   # the projection-decodability check's ridge grid (D46's probe)
n_boot: 1000
alpha: 0.05
k_tolerance: 0.05             # k* = the smallest k within this of the best validation Cause
cause_lower: 0.5              # D48 reading: held when Cause lo >= 0.5 and Isolate lo >= 0.75 at k*
isolate_lower: 0.75
determinism_check: true
figures: true

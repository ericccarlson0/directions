# Splitting the block where the sums appear (docs/DECISIONS.md D47) on the max task (D55), Qwen3-14B Base,
# around G* = 30 (D55 amended for the 14B: it never gathers at the answer token alone; job 1, run 39252850362).
name: varsplit
seed: 20260916
output_dir: results

model:
  backend: hf
  name: Qwen/Qwen3-14B-Base
  dtype: bfloat16
  device: cuda             # fail fast rather than fall back to the CPU (docs/INFRA.md)
  batch_size: 128           # the H100, as in the 14B's max map and probe

expressions: [max]
n_examples: 2048              # Part 1: the D46 expressions (same draw)
n_bases: 64                   # Part 2: the D45 bases and sources (same draw)
n_shots: 8
n_demo_pool: 96
gather: 30                    # G* (D55 amended for the 14B)
split_blocks: [29, 30, 31, 32, 33]   # G*-1..G*+3: block b maps read point b-1 to b
head_blocks: [30, 31, 32]     # G*..G*+2
n_folds: 5
lambdas: [0.1, 1.0, 10.0, 100.0]
n_perm: 200
alpha: 0.05
n_boot: 1000
min_accuracy: 0.5
gate: true
share_gain_min: 0.1           # D47 judgement thresholds
carry_lower: 0.1
not_carry_upper: 0.05
digit_change: 0.25
determinism_check: true
figures: true

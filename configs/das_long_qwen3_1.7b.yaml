# D48, exploratory robustness extension after run 38664560239: the sites where the sums are readable (and the
# control), larger subspaces (k = 16, 32, 64) and longer training (20 epochs). Otherwise the D48 settings.
name: das_long
seed: 20260916
output_dir: results

model:
  backend: hf
  name: Qwen/Qwen3-1.7B-Base
  dtype: bfloat16
  device: cuda             # fail fast rather than fall back to the CPU (docs/INFRA.md)
  batch_size: 128          # the state captures; the fits run on batch_size below

sites: [19, 21, 22, 23]   # the sum sites of D46-D47 and the control
control_site: 19            # the operands are not causally present here (D45)
variables: [S1, S2, Y, a]
ks: [16, 32, 64]
null_k: 64                    # the shuffled-target null at the largest k
n_train: 1536                 # bases per split, disjoint expressions
n_val: 256
n_test: 512
n_shots: 8
n_demo_pool: 96
batch_size: 32
epochs: 20
lr: 0.05
lambdas: [0.1, 1.0, 10.0, 100.0]   # the projection-decodability check's ridge grid (D46's probe)
n_boot: 1000
alpha: 0.05
k_tolerance: 0.05             # k* = the smallest k within this of the best validation Cause
cause_lower: 0.5              # D48 reading: held when Cause lo >= 0.5 and Isolate lo >= 0.75 at k*
isolate_lower: 0.75
determinism_check: true
figures: true

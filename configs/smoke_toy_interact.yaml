# Smoke run of D61's interaction test on a random tiny model (CPU, no downloads): the model cannot do the task, so the
# gate is off; checks the plumbing, the built-in check at read point 0, the files and the figure.
name: interact
seed: 20260916
output_dir: results

model:
  backend: toy
  dtype: float32
  device: cpu
  batch_size: 64

n_bases: 4
n_shots: 2
n_demo_pool: 8
read_points: [0, 1, 2]
chunk: 2
n_boot: 50
gate: false

# DAS at the answer token on Qwen3-14B Base (docs/DECISIONS.md D50): D49's design relative to the D45 gather
# (G = 30, run 38913588733): sites G, G+1, G+2 and the control by D50's rule; k = 8, 16, 32; 20 epochs.
name: das_d50
seed: 20260916
output_dir: results

model:
  backend: hf
  name: Qwen/Qwen3-14B-Base
  dtype: bfloat16
  device: cuda             # fail fast rather than fall back to the CPU (docs/INFRA.md)
  batch_size: 128          # the state captures; the fits run on batch_size below

sites: [28, 30, 31, 32]       # the control and G..G+2 (D50)
control_site: 28              # both bracket swaps move the answer in <= 0.10 here (D45: 0.00 and 0.06)
variables: [S1, S2, Y, a]
ks: [8, 16, 32]
null_k: 32                    # the shuffled-target null at the largest k
n_train: 1536                 # bases per split, disjoint expressions
n_val: 256
n_test: 512
n_shots: 8
n_demo_pool: 96
batch_size: 32
epochs: 20
lr: 0.05
lambdas: [0.1, 1.0, 10.0, 100.0]   # the projection-decodability check's ridge grid (D46's probe)
n_boot: 1000
alpha: 0.05
k_tolerance: 0.05             # k* = the smallest k within this of the best validation Cause
cause_lower: 0.5              # D48 reading: held when Cause lo >= 0.5 and Isolate lo >= 0.75 at k*
isolate_lower: 0.75
determinism_check: true
figures: true

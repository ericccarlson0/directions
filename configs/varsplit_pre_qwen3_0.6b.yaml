# D47, exploratory extension after run 38654038341: the head swaps of Part 2 in the three blocks before the gather
# (G-3..G-1), where part of one bracket reaches the answer token (the all-heads transfer at G was 0.25-0.69).
# Part 1 is not rerun. Otherwise the D47 settings.
name: varsplit_pre
seed: 20260916
output_dir: results

model:
  backend: hf
  name: Qwen/Qwen3-0.6B-Base
  dtype: bfloat16
  device: cuda             # fail fast rather than fall back to the CPU (docs/INFRA.md)
  batch_size: 128

expressions: [one_lane]
n_examples: 2048              # Part 1: the D46 expressions (same draw)
n_bases: 64                   # Part 2: the D45 bases and sources (same draw)
n_shots: 8
n_demo_pool: 96
gather: 21                    # the D45 gather read point G
split_blocks: [20, 21, 22, 23, 24]   # G-1..G+3: block b maps read point b-1 to b
head_blocks: [18, 19, 20]                     # G-3..G-1 (exploratory)
n_folds: 5
lambdas: [0.1, 1.0, 10.0, 100.0]
n_perm: 200
alpha: 0.05
n_boot: 1000
min_accuracy: 0.5
gate: true
share_gain_min: 0.1           # D47 judgement thresholds
carry_lower: 0.1
not_carry_upper: 0.05
digit_change: 0.25
determinism_check: true
figures: true
parts: [heads]
